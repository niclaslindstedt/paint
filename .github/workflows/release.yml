name: release

# Manual-only, and the ONLY thing a maintainer has to trigger. This one
# dispatch derives the semver bump from the changeset fragments in
# `.changes/unreleased/`, bumps `package.json`, collates those fragments into a
# dated CHANGELOG section, commits `chore(release): vX.Y.Z` to main, tags it,
# publishes a GitHub Release with the desktop downloads attached, and chains
# into pages.yml so the new tag is served at `/` without waiting for the next
# push.
#
# It used to be two workflows: `version-bump` computed the version and pushed a
# `v*` tag, and this one triggered on that tag. That split cost a PAT
# (`RELEASE_TOKEN`) purely so the tag push would fire a second workflow, and it
# cost a force-retag — the tag had to be moved onto the release commit that did
# not exist yet when the tag was created. Doing both halves in one run removes
# both: the tag is created on the release commit, once, and never moved.
#
# `bump` defaults to `auto` — the fragment-derived bump. Set it to an explicit
# patch/minor/major only to override that derivation.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. 'auto' derives it from the .changes/unreleased/ fragments (breaking → major, Added/Changed/Removed/Deprecated → minor, Fixed/Security → patch). Pick patch/minor/major to override."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A release is cut from main and nowhere else — the release commit is
    # pushed to main below, so dispatching from a branch would tag one thing
    # and push another.
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # main is pushed to below, so the checkout needs a token that can.
          # GITHUB_TOKEN suffices now that nothing downstream is triggered by
          # the tag push; RELEASE_TOKEN is still honoured for a protected main.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `npm ci` rewriting the lockfile means the release commit would carry a
      # dependency change nobody reviewed. Catch it before anything is tagged.
      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status --short
            exit 1
          fi

      # Resolve the effective bump. `auto` (the default) derives it from the
      # changeset fragments' front-matter so the release needs no human
      # judgement; an explicit patch/minor/major from the dispatch form
      # overrides that derivation. Either way an empty `.changes/unreleased/`
      # fails the `auto` path — there is nothing to release.
      - name: Resolve the bump
        id: resolve
        env:
          REQUESTED: ${{ inputs.bump }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "auto" ]; then
            BUMP=$(node scripts/release/compute-bump.mjs)
            echo "Auto-derived bump from fragments: $BUMP"
          else
            BUMP="$REQUESTED"
            echo "Using requested bump override: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # The current version comes from the highest released tag rather than
      # package.json: a release that failed after tagging but before its commit
      # landed leaves package.json behind, and computing from it would hand the
      # next run a version that is already taken.
      - name: Compute the next version
        id: bump
        env:
          BUMP: ${{ steps.resolve.outputs.bump }}
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-$(node -p "require('./package.json').version")}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${LATEST_TAG:-nothing} + $BUMP -> v${VERSION}"

      - name: Set the package version
        run: npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      # The notes are the changelog section, plus a standing footer about the
      # desktop downloads. The macOS half of that footer is not decoration: the
      # `.dmg` is signed ad hoc rather than notarized unless a signing identity
      # is configured (see the `desktop` job), so Gatekeeper refuses the first
      # launch — and a user with no answer to that prompt has no app.
      - name: Extract release-notes body
        run: |
          node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md
          cat >> .release-notes.md <<'NOTES'

          ---

          ### Downloads

          Paint runs in any browser at
          [paint.niclaslindstedt.se](https://paint.niclaslindstedt.se) — these
          are the same app as a desktop install, with the drawing bundled inside
          it so it works with no network at all.

          | | |
          | --- | --- |
          | **Windows** | the `.exe` installer |
          | **macOS** | the `.dmg` |
          | **Linux** | the `.AppImage` to run anywhere, or the `.deb` |

          **macOS:** the app is signed but not notarized, so the first launch is
          refused. Open **System Settings → Privacy & Security**, scroll to the
          message about Paint and choose **Open Anyway**. macOS remembers after
          that.
          NOTES

      - name: Sanity build
        run: npm run build
        env:
          VITE_BASE: /
          # Mirror the deploy env (pages.yml) so this build is representative.
          VITE_PWA_IGNORE_PATHS: /preview/,/branch/
          VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # App-folder names for the "Open in" link / stored documents; unset ->
          # both default to "Paint".
          VITE_DROPBOX_APP_FOLDER: ${{ vars.VITE_DROPBOX_APP_FOLDER }}
          VITE_GDRIVE_APP_FOLDER: ${{ vars.VITE_GDRIVE_APP_FOLDER }}

      # The tag is created HERE, on the release commit — not one commit
      # earlier by a separate workflow that this one then had to force-move it
      # away from. There is no force-push in this pipeline any more.
      - name: Commit the release and tag it
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      # A DRAFT, and the `publish` job at the bottom is what makes it public —
      # once every platform's installers are attached to it. Published here
      # instead, the release would be visible the moment the tag exists, which
      # is many minutes before three desktop runners finish and regardless of
      # whether they succeed at all: a Windows packaging failure
      # (`fail-fast: false`, so the other two carry on) would leave a public
      # release whose Windows download simply is not there, and the people who
      # find it are the ones who came to download the app.
      #
      # Idempotent on purpose: the tag is already pushed by the step above, so a
      # bare `gh release create` that fails (or a re-run after one did) would
      # leave a tagged version with no release at all. Creating-or-updating
      # makes the recovery GitHub's own "re-run failed jobs", which replays this
      # job against the version already in `steps.bump.outputs` rather than
      # cutting a second one — and the edit deliberately does NOT pass
      # `--draft`, so re-running against a release that is already public
      # refreshes its notes instead of retracting it.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file .release-notes.md
          fi

  # THE DOWNLOADS. One runner per platform, because each packages the app for
  # its own OS and an installer has to be built where the app was: an `.msi`
  # and `.exe` on Windows, a `.dmg` on macOS, a `.deb` and an `.AppImage` on
  # Linux.
  #
  # It checks out the TAG rather than main, so what ships is exactly what was
  # released — the tag names the release commit, which carries the changelog and
  # the bumped `package.json`, and `tauri.conf.json` reads its version straight
  # out of that file.
  desktop:
    needs: release
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    permissions:
      # contents: write — the installers are uploaded onto the GitHub Release.
      contents: write
      # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
      packages: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      # macOS SIGNING — optional, and the build is never left unsigned.
      #
      # Apple Silicon refuses to execute unsigned arm64 code and reports it to
      # the user as "the app is damaged", so an unsigned arm64 download is not
      # a download at all.
      #
      # **`|| '-'` IS LOAD-BEARING.** An unset secret expands to the EMPTY
      # STRING, not to nothing — and the bundler branches on whether the
      # variable is set, not on whether it says anything: an empty one reaches
      # `codesign --force -s ""`, which fails the whole build with `no identity
      # found` (tauri-macos-sign's `Keychain::sign` passes the string straight
      # through). `-` is codesign's own name for an AD-HOC signature, which is
      # what an unsigned-but-runnable arm64 build actually needs: the app runs
      # natively and the user answers one Gatekeeper prompt.
      #
      # Set MAC_SIGN_IDENTITY and the same job signs for real instead.
      APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ./.github/actions/package-desktop
        with:
          target: ${{ matrix.target }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}

      # Whatever this platform's bundler produced, BY EXTENSION — a step that
      # listed filenames would silently upload nothing the day a target changed
      # its suffix, and `if-no-files-found` has no equivalent here.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          assets=(tauri/target/release/bundle/**/*.{dmg,deb,AppImage,exe,msi})
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::${{ matrix.target }} produced no distributable files"
            ls -R tauri/target/release/bundle || true
            exit 1
          fi
          printf 'uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

  # THE RELEASE BECOMES VISIBLE HERE, and nowhere else: `needs: desktop` means
  # every platform in the matrix has packaged AND uploaded before anybody can
  # see the release page. If one target fails, the draft stays a draft — a
  # release missing a download is a bug report from every user on that
  # platform, and the fix (re-dispatch, or upload the installer by hand) is
  # much cheaper while nobody has seen it yet.
  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    permissions:
      # contents: write — this is the flag flip on the release itself.
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "published asset: \(.name)"'

  deploy:
    # Chain straight into pages.yml so the new tag is served at `/` immediately
    # — without this, deployment would wait for the next push to main.
    #
    # Deliberately `needs: release` and not `needs: publish`: the app IS the
    # website (§11.2), it is built from the tag that already exists, and holding
    # the web deploy hostage to a desktop packaging failure would take the
    # browser version down over a download nobody has yet.
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its build
      # job force-pushes the /branch/ slot to the `branch-deploy` orphan branch,
      # and `packages: read` because its npm ci resolves the framework from
      # GitHub Packages. A reusable workflow can't be granted fewer permissions
      # than it requests, so these must match or the whole run fails at startup.
      contents: write
      pages: write
      id-token: write
      packages: read
    secrets: inherit
