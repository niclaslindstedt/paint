name: seo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # npm ci resolves @niclaslindstedt/oss-framework from GitHub Packages.
  packages: read

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Builds, then asserts the §11.3 head signals (title, description,
      # canonical, Open Graph, Twitter card, JSON-LD), the crawler files
      # (robots.txt, sitemap.xml, llms.txt), and the §11.4 PWA output
      # (manifest, service worker, version + precache manifests).
      - run: make check-seo
