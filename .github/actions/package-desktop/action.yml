name: Package the desktop app
description: >
  Build the site, bundle it into the Tauri shell, and produce this runner's
  installers. Shared by desktop-tauri.yml (the dispatch-only "does it still
  package?" button) and release.yml (the downloads attached to every release),
  so the two can never drift into packaging differently.

inputs:
  target:
    description: windows | macos | linux — which runner this is.
    required: true
  npm-token:
    description: >
      A token with `read:packages`. `npm ci` resolves
      @niclaslindstedt/oss-framework from the GitHub Packages registry, which
      requires auth even for a public package.
    required: true
  mac-signing:
    description: >
      `on` to sign the macOS build with a real certificate. ANYTHING ELSE —
      including unset — signs it ad hoc, which is the default and needs no
      secrets. Deliberately an opt-in switch rather than "sign if the secrets
      look present": see the step below for what that cost.
    default: ""
  mac-signing-identity:
    description: The certificate's identity name. Only read when mac-signing is `on`.
    default: ""
  mac-certificate:
    description: The signing certificate, base64 .p12. Only read when mac-signing is `on`.
    default: ""
  mac-certificate-password:
    description: Its password. Only read when mac-signing is `on`.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        registry-url: "https://npm.pkg.github.com"
        scope: "@niclaslindstedt"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri

    # WebKitGTK is the webview on Linux, and the bundler wants `patchelf` and
    # librsvg for the AppImage. Windows has WebView2 in the image and macOS has
    # WKWebView in the OS, so neither needs anything.
    - name: Linux packaging libraries
      if: inputs.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

    # macOS SIGNING, and the reason it is a STEP rather than an `env:` block.
    #
    # Apple Silicon refuses to execute unsigned arm64 code and reports it as
    # "the app is damaged", so a macOS build is never left unsigned. `-` is
    # codesign's own name for an AD-HOC signature: the app runs natively, needs
    # no secrets, and the user answers one Gatekeeper prompt. That is the
    # default, and it is what the release notes promise.
    #
    # The certificate variables must be genuinely ABSENT for that path, not
    # empty — `tauri_bundler::bundle::macos::sign::keychain` reads them with
    # `var_os`, which answers `Some("")` for a variable that is set to nothing
    # and takes the import branch anyway. An `env:` key with an expression
    # ALWAYS sets its variable, so there is no expression that can leave one
    # out; only a step writing to $GITHUB_ENV can. Hence this.
    #
    # And the switch is an explicit `on` rather than "sign if the secrets look
    # present", because half-configured signing has now broken this release
    # twice: once on an identity with no certificate behind it (`<name>: no
    # identity found`) and once on a certificate that would not import
    # (`SecKeychainItemImport: One or more parameters ... were not valid`).
    # Both failed the WHOLE build, where ad hoc would have shipped. Turning
    # real signing on is therefore a deliberate act, taken when there is a
    # certificate known to work — set the `MAC_SIGNING` repository variable to
    # `on` alongside the three secrets.
    - name: macOS signing
      if: inputs.target == 'macos'
      shell: bash
      env:
        MAC_SIGNING: ${{ inputs.mac-signing }}
        IDENTITY: ${{ inputs.mac-signing-identity }}
        CERT: ${{ inputs.mac-certificate }}
        CERT_PASSWORD: ${{ inputs.mac-certificate-password }}
      run: |
        set -euo pipefail
        if [ "$MAC_SIGNING" = "on" ] && [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
          echo "Signing with the configured certificate."
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_CERTIFICATE<<__PAINT_CERT__"
            echo "$CERT"
            echo "__PAINT_CERT__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
          } >> "$GITHUB_ENV"
        else
          if [ "$MAC_SIGNING" = "on" ]; then
            echo "::warning::MAC_SIGNING is 'on' but the identity or certificate is missing — signing ad hoc instead."
          fi
          echo "Signing ad hoc — the download is unsigned-but-runnable and Gatekeeper asks once."
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
        fi

    # The site build lives in the root project; the shell only carries its
    # output. `tauri/` is deliberately not a workspace member — it has its own
    # toolchain — so it is a second, tiny install.
    - name: Install
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
    - name: Install the shell's own tooling
      shell: bash
      run: npm ci --prefix tauri

    # `npm run package` is `bundle-web.mjs` (which builds the site with the
    # service worker off) followed by `tauri build`. Going through the shell's
    # own script rather than calling `tauri build` here is what keeps a release
    # build identical to the one a maintainer makes locally.
    - name: Package
      shell: bash
      run: npm run package --prefix tauri
