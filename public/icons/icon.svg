<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Paint">
  <!-- The app mark: a stylized fountain pen — barrel, collar, nib — held at 45° and
       painted solid in the sibling apps' green on the app surface, at the
       weight the sibling notes / checklist marks wear, with the seams between
       the pieces cut out of the silhouette rather than drawn on it. The shapes
       are filled *and* stroked with a round-joined stroke, which is what
       softens their corners and blunts the nib's point. Kept in lockstep with
       scripts/generate-icons.mjs, which rasterises these very points into the
       PWA install icons, the favicon, and og.png. -->
  <rect width="100" height="100" rx="20" fill="#0b0d10" />
  <!-- The outer group is the install icons' safe zone: the generator insets the
       mark by 12% of the tile (its `pad`), and this keeps the vector twin
       framed the same way. -->
  <!-- The slit and breather hole are cut out of the nib after its outline, as
       scripts/generate-icons.mjs does, so they keep their drawn size. -->
  <mask id="cuts" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
    <rect x="-50" y="-50" width="200" height="200" fill="#fff" />
    <g transform="translate(3.54 -3.54) rotate(45 50 50)" fill="#000">
      <polygon points="53.40,95.00 53.28,95.88 52.94,96.70 52.40,97.40 51.70,97.94 50.88,98.28 50.00,98.40 49.12,98.28 48.30,97.94 47.60,97.40 47.06,96.70 46.72,95.88 46.60,95.00 46.72,94.12 47.06,93.30 47.60,92.60 48.30,92.06 49.12,91.72 50.00,91.60 50.88,91.72 51.70,92.06 52.40,92.60 52.94,93.30 53.28,94.12" />
      <path d="M49 95H51V124H49Z" />
    </g>
  </mask>
  <g transform="translate(50 50) scale(0.76) translate(-50 -50)">
    <g mask="url(#cuts)">
      <g transform="translate(3.54 -3.54) rotate(45 50 50)" fill="#6ee7a7" stroke="#6ee7a7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 5H62L64 50H36Z" />
        <path d="M33 60H67V72H33Z" />
        <path d="M38 82H62L64 90L60 100L53 111L50 117L47 111L40 100L36 90Z" />
      </g>
    </g>
  </g>
</svg>
