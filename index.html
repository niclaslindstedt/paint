<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. `system`
     is the app's default look and follows `prefers-color-scheme`, so the first
     paint already matches the OS rather than flashing dark on a light phone. -->
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's focus
         auto-zoom — on a drawing app a stray pinch mid-stroke would otherwise
         zoom the shell instead of drawing. `viewport-fit=cover` lets the app
         paint under the notch / home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="author" content="Niclas Lindstedt" />
    <meta name="application-name" content="Paint" />
    <title>Paint — a local-first sketchpad</title>
    <meta
      name="description"
      content="Paint is a local-first sketchpad PWA: sketch a concept on a canvas bigger than your screen, draw eleven shapes from one button, select marks to move, copy and paste them, type captions straight onto it, stack it into layers, put the page on paper or canvas so watercolour mixes and bleeds the way it does on the real thing, blur or grain the whole page, group drawings into folders, and keep everything on your device — with optional Dropbox or Google Drive sync."
    />
    <link rel="canonical" href="https://paint.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paint — a local-first sketchpad" />
    <meta
      property="og:description"
      content="A privacy-first paint PWA for sketching simple concepts: a pinch-to-zoom canvas, eleven shapes behind one button, four ways to select (box, oval, lasso and a trace that follows the contours of what you drew) with copy, cut and paste, a text tool with real typefaces you can drag into place, media that behave like their medium (a graphite pencil, watercolour that spreads and granulates, bristle brushes round and flat, an airbrush, chisel felt tips), a page made of paper or canvas that the wet tools mix and bleed into, tools sized in the millimetres the real thing comes in and saved under names you choose, layers on a swipe, page filters (blur and grain) that change nothing underneath, drag-and-drop images, folders and favorites, pluggable tools you switch on and reorder in settings, download as PNG, JPG or SVG or a layered .pct paint file, and optional cloud sync."
    />
    <meta property="og:url" content="https://paint.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://paint.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paint — a local-first sketchpad" />
    <meta
      name="twitter:description"
      content="A privacy-first paint PWA: sketch on a canvas bigger than your screen, add tools when you need them, sync only if you want to."
    />
    <meta
      name="twitter:image"
      content="https://paint.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Paint",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "A local-first sketchpad PWA with a pinch-to-zoom canvas, eleven shapes behind one button, four ways to select with copy, cut and paste, a text tool, media that behave like their medium — watercolour, graphite, bristle brushes — sized in real millimetres and saved under names you choose, paper and canvas surfaces the wet tools mix and bleed into, layers, page filters, folders and favorites, pluggable and reorderable drawing tools, drag-and-drop images, PNG / JPG / SVG download, a layered .pct file format, optional Dropbox / Google Drive sync, and encryption at rest.",
        "url": "https://paint.niclaslindstedt.se/",
        "image": "https://paint.niclaslindstedt.se/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
