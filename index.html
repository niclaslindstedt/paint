<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. `system`
     is the app's default look and follows `prefers-color-scheme`, so the first
     paint already matches the OS rather than flashing dark on a light phone. -->
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's focus
         auto-zoom — on a drawing app a stray pinch mid-stroke would otherwise
         zoom the shell instead of drawing. `viewport-fit=cover` lets the app
         paint under the notch / home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="author" content="Niclas Lindstedt" />
    <meta name="application-name" content="Paint" />
    <title>Paint — a local-first sketchpad</title>
    <meta
      name="description"
      content="Paint is a local-first sketchpad PWA: draw a concept on a canvas, switch extra tools on when you need them, and keep every drawing on your device — with optional Dropbox or Google Drive sync."
    />
    <link rel="canonical" href="https://paint.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paint — a local-first sketchpad" />
    <meta
      property="og:description"
      content="A privacy-first paint PWA for sketching simple concepts: a canvas, pluggable tools you switch on in settings, themes, and optional cloud sync."
    />
    <meta property="og:url" content="https://paint.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://paint.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paint — a local-first sketchpad" />
    <meta
      name="twitter:description"
      content="A privacy-first paint PWA: sketch a concept on a canvas, add tools when you need them, sync only if you want to."
    />
    <meta
      name="twitter:image"
      content="https://paint.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Paint",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "A local-first sketchpad PWA with pluggable drawing tools, optional Dropbox / Google Drive sync, encryption at rest, and PNG export.",
        "url": "https://paint.niclaslindstedt.se/",
        "image": "https://paint.niclaslindstedt.se/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
